<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raw Material Request | LABH SETU</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --forest: #08434b;
            --gold: #eab308;
            --ivory: #fdfdfb;
            --earth: #bc6c25;
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--ivory);
            overflow-x: hidden;
        }

        /* --- ROYAL ANIMATED BACKGROUND --- */
        #royal-bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(circle at 50% 50%, #ffffff 0%, #eef5f3 100%);
        }

        canvas { position: absolute; top: 0; left: 0; pointer-events: none; }

        /* --- FORM STYLING --- */
        .glass-form-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(0,0,0,0.05);
            border-radius: 12px;
            padding: 45px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.06);
            margin: 60px 0;
        }

        .main-heading {
            font-family: 'Playfair Display', serif;
            color: var(--forest);
            font-size: 2.2rem;
            margin-bottom: 10px;
        }

        .earth-divider {
            width: 80px;
            height: 3px;
            background: var(--earth);
            margin: 0 auto 35px;
        }

        .form-label {
            font-weight: 600;
            color: var(--forest);
            margin-top: 20px;
            margin-bottom: 8px;
            display: block;
        }

        .form-control, .form-select {
            border-radius: 6px;
            border: 1px solid #ced4da;
            padding: 12px;
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--earth);
            box-shadow: 0 0 0 0.25rem rgba(188, 108, 37, 0.1);
        }

        .btn-source {
            background-color: var(--earth);
            color: white;
            font-weight: 700;
            padding: 16px;
            border-radius: 30px;
            border: none;
            width: 100%;
            margin-top: 40px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s ease;
        }

        .btn-source:hover {
            background-color: #9b541a;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(188, 108, 37, 0.2);
        }

        .helper-text {
            font-size: 0.8rem;
            color: #6c757d;
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <div id="royal-bg-container">
        <canvas id="leafCanvas"></canvas>
    </div>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-7">
                <div class="glass-form-card" data-aos="fade-up">
                    <div class="text-center">
                        <img src="mainimg.png" alt="Labh Setu Logo" style="max-height: 70px; margin-bottom: 15px;">
                        <h1 class="main-heading">Raw Material Request</h1>
                        <div class="earth-divider"></div>
                    </div>

                    <form id="sourceForm">
                        <div class="mb-3">
                            <label class="form-label">Who are you?</label>
                            <select class="form-select" required>
                                <option value="" disabled selected>Select your profile</option>
                                <option>Rural Workshop / Artisan</option>
                                <option>Farmer / Agriculturalist</option>
                                <option>Small Help Group (SHG)</option>
                                <option>Small Scale Industry (MSME)</option>
                                <option>Large Scale Industry</option>
                                <option>Personal Use / Hobbyist</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">What material are you looking for?</label>
                            <select class="form-select" required>
                                <option value="" disabled selected>Choose material category</option>
                                <option>Processed Textile / Rags</option>
                                <option>Recycled Plastic Granules</option>
                                <option>Processed Paper / Pulp</option>
                                <option>Industrial Metal Scrap</option>
                                <option>Composted Organic Matter</option>
                                <option>Crushed Construction Aggregate</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Order Scale</label>
                            <div class="d-flex gap-4 mt-1">
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="scale" id="scaleSmall" value="small" checked onclick="updateWeightHint('KG')">
                                    <label class="form-check-label" for="scaleSmall">Small Scale</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="scale" id="scaleBulk" value="bulk" onclick="updateWeightHint('Metric Tons')">
                                    <label class="form-check-label" for="scaleBulk">Bulk Order</label>
                                </div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Exact Quantity Required</label>
                            <div class="input-group">
                                <input type="number" step="0.01" class="form-control" placeholder="Enter amount" required>
                                <span class="input-group-text" id="unitLabel">KG</span>
                            </div>
                            <div class="helper-text">Enter the specific weight needed for your production.</div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Delivery Area / District</label>
                            <input type="text" class="form-control" placeholder="Where do you need the material delivered?" required>
                        </div>

                        <button type="submit" class="btn-source">Request Source Match</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init();

        // Function to update weight label based on scale
        function updateWeightHint(unit) {
            document.getElementById('unitLabel').innerText = unit;
        }

        // --- ROYAL LEAF ANIMATION SCRIPT ---
        const canvas = document.getElementById('leafCanvas');
        const ctx = canvas.getContext('2d');
        let leaves = [];

        function init() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            leaves = [];
            for (let i = 0; i < 20; i++) leaves.push(new Leaf());
        }

        class Leaf {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * -canvas.height;
                this.size = Math.random() * 12 + 6;
                this.speedY = Math.random() * 0.5 + 0.3;
                this.opacity = Math.random() * 0.2 + 0.1;
                this.angle = Math.random() * 360;
                this.spin = Math.random() * 0.3 - 0.15;
            }
            update() {
                this.y += this.speedY;
                this.x += Math.sin(this.y / 150);
                this.angle += this.spin;
                if (this.y > canvas.height) this.reset();
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle * Math.PI / 180);
                ctx.fillStyle = '#81c784';
                ctx.globalAlpha = this.opacity;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.quadraticCurveTo(this.size, -this.size, this.size * 2, 0);
                ctx.quadraticCurveTo(this.size, this.size, 0, 0);
                ctx.fill();
                ctx.restore();
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            leaves.forEach(l => { l.update(); l.draw(); });
            requestAnimationFrame(animate);
        }

        init(); animate();
        window.onresize = init;
    </script>
</body>
</html>
