<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Material Routing | LABH SETU</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --forest: #08434b;
            --gold: #eab308;
            --ivory: #fdfdfb;
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--ivory);
            overflow-x: hidden;
        }

        /* --- THE ROYAL ANIMATED BACKGROUND --- */
        #royal-bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(circle at 50% 50%, #ffffff 0%, #e8f5e9 100%);
        }

        canvas { position: absolute; top: 0; left: 0; pointer-events: none; }

        /* --- FORM STYLING --- */
        .glass-form-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(0,0,0,0.05);
            border-radius: 12px;
            padding: 45px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.06);
            margin: 60px 0;
        }

        .main-heading {
            font-family: 'Playfair Display', serif;
            color: var(--forest);
            font-size: 2.2rem;
            margin-bottom: 10px;
        }

        .gold-divider {
            width: 80px;
            height: 3px;
            background: var(--gold);
            margin: 0 auto 35px;
        }

        .form-label {
            font-weight: 600;
            color: var(--forest);
            margin-top: 20px;
            margin-bottom: 8px;
            display: block;
        }

        .form-control, .form-select {
            border-radius: 6px;
            border: 1px solid #ced4da;
            padding: 12px;
            background-color: #fff;
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 0.25rem rgba(234, 179, 8, 0.1);
        }

        /* Hidden Compensation Field Styling */
        #priceField {
            display: none;
            margin-top: 15px;
            padding: 15px;
            background: rgba(234, 179, 8, 0.05);
            border-radius: 8px;
            border-left: 4px solid var(--gold);
            animation: fadeIn 0.4s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .btn-routing {
            background-color: var(--forest);
            color: white;
            font-weight: 700;
            padding: 16px;
            border-radius: 30px;
            border: none;
            width: 100%;
            margin-top: 40px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s ease;
        }

        .btn-routing:hover {
            background-color: #063238;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(8, 67, 75, 0.2);
        }

        .helper-text {
            font-size: 0.8rem;
            color: #6c757d;
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <div id="royal-bg-container">
        <canvas id="leafCanvas"></canvas>
    </div>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-7">
                <div class="glass-form-card" data-aos="fade-up">
                    <div class="text-center">
                        <img src="mainimg.png" alt="Labh Setu Logo" style="max-height: 70px; margin-bottom: 15px;">
                        <h1 class="main-heading">Material Routing Form</h1>
                        <div class="gold-divider"></div>
                    </div>

                    <form id="routingForm">
                        <div class="mb-3">
                            <label class="form-label">What are you discarding?</label>
                            <select class="form-select" required>
                                <option value="" disabled selected>Choose material category</option>
                                <option>Textile / Fabric Waste</option>
                                <option>Industrial Plastic / Polymers</option>
                                <option>Paper / Cardboard</option>
                                <option>Scrap Metal</option>
                                <option>Organic / Agricultural Waste</option>
                                <option>Construction & Demolition Debris</option>
                                <option>Other Synthetic Materials</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Estimated Quantity (in KG)</label>
                            <input type="number" step="0.01" class="form-control" placeholder="Enter weight (e.g., 25.5)" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Verification Image</label>
                            <input type="file" class="form-control" accept="image/*" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Area / Pickup Location</label>
                            <input type="text" class="form-control" placeholder="Enter city or district" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Condition of Material</label>
                            <select> class="form-select" required>
                                <option value="" disabled selected>Select quality state</option>
                                <option>Raw / Untouched</option>
                                <option>Processed</option>
                                <option>Damaged / Scrap</option>
                            </select>  
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Would you like to trade for compensation?</label>
                            <div class="d-flex gap-4 mt-2">
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="trade" id="tradeYes" value="yes" onclick="togglePrice(true)">
                                    <label class="form-check-label" for="tradeYes">Yes (Money/Credits)</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="trade" id="tradeNo" value="no" checked onclick="togglePrice(false)">
                                    <label class="form-check-label" for="tradeNo">No (Donation)</label>
                                </div>
                            </div>
                        </div>

                        <div id="priceField">
                            <label class="form-label">Expected Amount (₹)</label>
                            <input type="number" class="form-control" placeholder="Enter your expected price">
                            <div class="helper-text">Our bridge will verify this based on current market worth.</div>
                        </div>

                        <button type="submit" class="btn-routing">Process Material for Routing</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init();

        // Function to show/hide the price field
        function togglePrice(show) {
            const priceDiv = document.getElementById('priceField');
            priceDiv.style.display = show ? 'block' : 'none';
        }

        // --- ROYAL LEAF ANIMATION SCRIPT ---
        const canvas = document.getElementById('leafCanvas');
        const ctx = canvas.getContext('2d');
        let leaves = [];

        function init() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            leaves = [];
            for (let i = 0; i < 20; i++) leaves.push(new Leaf());
        }

        class Leaf {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * -canvas.height;
                this.size = Math.random() * 12 + 6;
                this.speedY = Math.random() * 0.6 + 0.4;
                this.opacity = Math.random() * 0.3 + 0.1;
                this.angle = Math.random() * 360;
                this.spin = Math.random() * 0.4 - 0.2;
            }
            update() {
                this.y += this.speedY;
                this.x += Math.sin(this.y / 120);
                this.angle += this.spin;
                if (this.y > canvas.height) this.reset();
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle * Math.PI / 180);
                ctx.fillStyle = '#a5d6a7';
                ctx.globalAlpha = this.opacity;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.quadraticCurveTo(this.size, -this.size, this.size * 2, 0);
                ctx.quadraticCurveTo(this.size, this.size, 0, 0);
                ctx.fill();
                ctx.restore();
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            leaves.forEach(l => { l.update(); l.draw(); });
            requestAnimationFrame(animate);
        }

        init(); animate();
        window.onresize = init;
    </script>
</body>
</html>
